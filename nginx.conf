server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Optionales lokales KI-Modell (OpenAI-kompatibel, z.B. LocalAI auf dem Host).
    # Nur die zwei benötigten Endpunkte werden durchgereicht. Upstream wird über eine
    # Variable + Resolver erst zur Anfragezeit aufgelöst: Ist kein Modell erreichbar
    # (z.B. auf dem MacBook), startet nginx trotzdem, die Anfrage endet dann in 502.
    # __RESOLVER__ wird beim Containerstart durch den DNS-Server des Containers ersetzt.
    resolver __RESOLVER__ valid=30s ipv6=off;

    location = /v1/models {
        set $llm_upstream host.docker.internal:8080;
        proxy_pass http://$llm_upstream;
        proxy_set_header Host $llm_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /v1/chat/completions {
        set $llm_upstream host.docker.internal:8080;
        limit_except POST { deny all; }
        proxy_pass http://$llm_upstream;
        proxy_set_header Host $llm_upstream;
        proxy_buffering off;          # Streaming: Tokens sofort durchreichen
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
    }

    location ~ ^/(detect-names|health)$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_types text/html text/css application/javascript;
}
